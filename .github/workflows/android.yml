name: Android APK
on:
  workflow_dispatch:
  push:
    tags: ['android-v*']
    branches: ['android-app']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - run: npm ci
      - run: npm test && npm run sync
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e 'if(process.env.GITHUB_REF_NAME !== "android-v" + require("./package.json").version) process.exit(1)'
      - run: cd android && ./gradlew assembleRelease --no-daemon
      - name: Sign release with permanent key
        if: startsWith(github.ref, 'refs/tags/')
        env:
          LIFE_KEYSTORE_BASE64: ${{ secrets.LIFE_KEYSTORE_BASE64 }}
          LIFE_STORE_PASSWORD: ${{ secrets.LIFE_STORE_PASSWORD }}
          LIFE_KEY_PASSWORD: ${{ secrets.LIFE_KEY_PASSWORD }}
          LIFE_KEY_ALIAS: life
        run: |
          test -n "$LIFE_KEYSTORE_BASE64" || { echo 'Configure Life signing secrets before publishing'; exit 1; }
          printf '%s' "$LIFE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/life-release.jks"
          export LIFE_KEYSTORE="$RUNNER_TEMP/life-release.jks"
          export LIFE_BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          python3 scripts/sign-apk.py
      - uses: actions/upload-artifact@v4
        with:
          name: life-android-build
          path: |
            android/app/build/outputs/apk/release/*.apk
            release/*.apk
            release/*.sha256
      - name: Publish signed APK
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.apk release/*.sha256 --title "Life ${GITHUB_REF_NAME#android-v}" --generate-notes --verify-tag
      - name: Update in-app channel
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-update.cjs
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/life-release.jks"
