name: Backend checks
on:
  push:
    paths: ['backend/**', '.github/workflows/backend.yml', 'compose.yaml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml', 'compose.yaml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: life
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: life_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U life -d life_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Select PostgreSQL
        if: matrix.database == 'postgres'
        run: |
          echo 'DATABASE_URL=postgresql+psycopg://life:test-password@localhost/life_test' >> "$GITHUB_ENV"
          echo 'TEST_DATABASE_URL=postgresql+psycopg://life:test-password@localhost/life_test' >> "$GITHUB_ENV"
      - run: python -m alembic upgrade head
      - run: python -m alembic check
      - run: python -m pytest -q
