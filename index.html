<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Life · личное пространство</title><style>
*{box-sizing:border-box}body{margin:0;background:#101217;color:#eceef5;font:15px system-ui}button,input,select{font:inherit}button{cursor:pointer;color:inherit;border:0;background:#252935;padding:12px 17px;border-radius:12px}button:hover{background:#373d50}aside{position:fixed;width:220px;padding:32px 20px;height:100vh;border-right:1px solid #292c35}h1{font-size:34px;letter-spacing:-1px}h2{font-size:18px}small,p{color:#959cad;line-height:1.6}.brand{font-size:30px;font-weight:800;letter-spacing:5px;color:#b4a2ff}nav{display:grid;gap:10px;margin-top:48px}nav button{text-align:left;background:transparent}.active{background:#a999ef!important;color:#15121d}main{max-width:1350px;margin-left:220px;padding:36px 48px 100px}header{display:flex;justify-content:space-between;align-items:center}.tag{font-size:12px;color:#b8a8ff;letter-spacing:2px}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:20px}.card{background:#191c24;border:1px solid #2b2e39;border-radius:22px;padding:24px;margin-bottom:20px}.hero{background:linear-gradient(120deg,#29243d,#1d2734)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.number{font-size:30px;font-weight:650;letter-spacing:-1px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 0;border-bottom:1px solid #2a2e39}.row:last-child{border:0}.muted{color:#959cad}.positive{color:#8cddbb}.negative{color:#efa8ad}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.calendar button{padding:12px 0;background:transparent;min-height:48px}.calendar .today{outline:1px solid #b4a2ff}.dot{display:block;color:#b4a2ff;font-size:10px;height:12px}.week{text-align:center;color:#8b92a2;font-size:12px;padding:12px 0}svg{width:100%;height:170px}.empty{padding:28px 0;color:#959cad}dialog{background:#1c202a;color:#eee;border:1px solid #45495c;border-radius:22px;max-width:440px;width:92%;padding:25px}dialog::backdrop{background:#000a}input,select{width:100%;padding:13px;background:#11141b;border:1px solid #424758;color:#eee;border-radius:10px;margin:7px 0 15px}label{display:block;color:#afb5c4}progress{width:100%;accent-color:#b4a2ff;height:9px}.pill{font-size:12px;padding:6px 10px;border-radius:20px;background:#2d2941;color:#c3b4ff}.actions{display:flex;gap:10px;flex-wrap:wrap}#notice{padding:12px 18px;background:#232632;border-radius:12px;margin:18px 0;color:#b1b7c6;font-size:13px} @media(max-width:800px){aside{height:auto;width:100%;bottom:0;background:#171a22;z-index:3;padding:8px;border-top:1px solid #343744}aside .brand,aside p{display:none}nav{display:flex;margin:0;justify-content:space-around;gap:0}nav button{font-size:11px;padding:12px 8px}main{margin:0;padding:24px 18px 95px}.grid{display:block}.stats{gap:8px}.number{font-size:23px}.card{padding:19px}h1{font-size:28px}header button{padding:11px}.brand{font-size:20px}}
</style><aside><div class="brand">LIFE<span style="color:#6bd1b2">.</span></div><p>Твоё личное пространство</p><nav id="nav"></nav><p style="margin-top:60px">Меньше шума.<br>Больше ясности.</p></aside><main><header><div><span class="tag">ЛИЧНЫЙ ЦЕНТР УПРАВЛЕНИЯ</span><h1 id="title"></h1></div><button class="active" onclick="openForm()">＋ Добавить</button></header><div id="notice">Записи сохраняются в этом браузере. Сервер ещё не подключён. Сохраняй резервную копию в разделе «Ещё».</div><section id="view"></section></main><dialog id="modal"><form id="form"><h2>Новая запись</h2><label>Раздел<select id="kind"><option value="expense">Расход</option><option value="income">Доход</option><option value="event">Событие</option><option value="task">Задача</option><option value="project">Проект</option></select></label><label>Название<input id="name" required maxlength="120" placeholder="Например, аренда сервера"></label><label id="moneyLabel">Сумма, ₽<input id="amount" type="number" min="0.01" step="0.01"></label><label>Дата<input id="date" type="date" required></label><div class="actions"><button class="active">Сохранить</button><button type="button" onclick="modal.close()">Отмена</button></div></form></dialog><script>
const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),today=new Date().toLocaleDateString('en-CA');let data;try{data=JSON.parse(localStorage.getItem('life-v1'))||[]}catch{data=[]}let page='home',month=new Date(),chosen=today;const sections={home:'Главная',money:'Деньги',day:'Календарь',projects:'Проекты',more:'Ещё'},rub=n=>new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB',maximumFractionDigits:0}).format(n/100);function save(){localStorage.setItem('life-v1',JSON.stringify(data));render()}function openForm(k){$('kind').value=k||'expense';$('date').value=chosen;$('moneyLabel').hidden=!['expense','income'].includes($('kind').value);$('amount').required=!$('moneyLabel').hidden;$('modal').showModal()}$('kind').onchange=()=>{$('moneyLabel').hidden=!['expense','income'].includes($('kind').value);$('amount').required=!$('moneyLabel').hidden};$('form').onsubmit=e=>{e.preventDefault();data.push({id:crypto.randomUUID(),kind:$('kind').value,title:$('name').value.trim(),amount:Math.round(Number($('amount').value)*100),date:$('date').value,done:false});save();$('form').reset();$('modal').close()};function go(p){page=p;render()}function rows(items){return items.length?items.map(r=>`<div class="row"><div><b>${esc(r.title)}</b><br><small>${esc(r.date)} · ${r.kind==='task'?'Задача':r.kind==='event'?'Событие':r.kind==='project'?'Проект':r.kind==='expense'?'Расход':'Доход'}</small></div>${['expense','income'].includes(r.kind)?`<b class="${r.kind==='income'?'positive':'negative'}">${r.kind==='income'?'+':'−'}${rub(r.amount)}</b>`:`<button onclick="toggle('${r.id}')">${r.done?'✓ Готово':'○'}</button>`}</div>`).join(''):'<div class="empty">Пока пусто. Добавь первую запись — она появится здесь.</div>'}function toggle(id){data.find(r=>r.id===id).done=!data.find(r=>r.id===id).done;save()}function cal(){let y=month.getFullYear(),m=month.getMonth(),offset=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate();return `<div class="card"><div class="row"><h2>${month.toLocaleDateString('ru',{month:'long',year:'numeric'})}</h2><div><button onclick="shift(-1)">‹</button> <button onclick="shift(1)">›</button></div></div><div class="calendar">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<div class="week">${x}</div>`).join('')}${'<span></span>'.repeat(offset)}${Array.from({length:days},(_,i)=>{let d=`${y}-${String(m+1).padStart(2,'0')}-${String(i+1).padStart(2,'0')}`;return `<button class="${d===chosen?'active':d===today?'today':''}" onclick="chosen='${d}';render()">${i+1}<span class="dot">${data.some(r=>r.date===d)?'●':''}</span></button>`}).join('')}</div><h2>${esc(chosen)}</h2>${rows(data.filter(r=>r.date===chosen))}</div>`}function shift(n){month=new Date(month.getFullYear(),month.getMonth()+n,1);render()}function chart(){let sums=Array.from({length:14},(_,i)=>{let d=new Date();d.setDate(d.getDate()-13+i);let key=d.toLocaleDateString('en-CA');return data.filter(r=>r.date===key&&r.kind==='expense').reduce((a,r)=>a+r.amount,0)}),max=Math.max(...sums,1);return `<svg viewBox="0 0 560 160" role="img" aria-label="Расходы за последние четырнадцать дней">${[30,80,130].map(y=>`<path d="M0 ${y}H560" stroke="#303440"/>`).join('')}${sums.map((v,i)=>`<rect x="${i*40+5}" y="${140-v/max*115}" width="24" height="${Math.max(v/max*115,2)}" rx="5" fill="${i===13?'#8ce0c1':'#a595e0'}"><title>${rub(v)}</title></rect>`).join('')}</svg><small>14 дней назад <span style="float:right">Сегодня</span></small>`}function render(){ $('nav').innerHTML=Object.entries(sections).map(([k,v])=>`<button class="${page===k?'active':''}" onclick="go('${k}')">${v}</button>`).join('');$('title').textContent=page==='home'?'Твой день, Вован':sections[page];let income=data.filter(r=>r.kind==='income').reduce((a,r)=>a+r.amount,0),expense=data.filter(r=>r.kind==='expense').reduce((a,r)=>a+r.amount,0),fin=`<div class="card hero"><span class="tag">ФИНАНСОВАЯ КАРТИНА</span><div class="stats"><div><p>Баланс записей</p><div class="number">${rub(income-expense)}</div></div><div><p>Доходы</p><div class="number positive">${rub(income)}</div></div><div><p>Расходы</p><div class="number">${rub(expense)}</div></div></div><p>За всё время · начальный остаток пока не задан</p></div>`,graph=`<div class="card"><h2>Ритм расходов</h2>${chart()}</div>`;let html='';if(page==='home')html=`${fin}<div class="grid"><div>${graph}<div class="card"><h2>В фокусе сегодня <span class="pill">${data.filter(r=>r.kind==='task'&&!r.done).length} задач</span></h2>${rows(data.filter(r=>r.kind==='task'&&!r.done).slice(0,4))}<button onclick="openForm('task')">＋ Задача</button></div></div><div>${cal()}</div></div>`;if(page==='money')html=fin+graph+`<div class="card"><h2>История операций</h2>${rows(data.filter(r=>['income','expense'].includes(r.kind)).sort((a,b)=>b.date.localeCompare(a.date)))}</div>`;if(page==='day')html=cal();if(page==='projects')html=`<div class="card hero"><h2>От идеи до результата</h2><p>Держи актуальные проекты перед глазами. Начни с одного следующего шага.</p><button onclick="openForm('project')">＋ Новый проект</button></div><div class="card">${rows(data.filter(r=>r.kind==='project'))}</div><div class="card"><h2>Все задачи</h2>${rows(data.filter(r=>r.kind==='task'))}</div>`;if(page==='more')html=`<div class="card"><h2>Твои данные</h2><p>${data.length} записей · локальное хранение на этом устройстве</p><div class="actions"><button onclick="backup()">Скачать резервную копию</button><button onclick="document.getElementById('restore').click()">Восстановить копию</button><input type="file" id="restore" accept="application/json" hidden onchange="restoreFile(this.files[0])"></div></div><div class="card"><h2>Структура Life</h2><p>Финансы → операции<br>Календарь → события и задачи<br>Проекты → список проектов<br>Данные → резервные копии</p><p>Обучение, подписки, связи проектов и серверная синхронизация появятся следующими. Эта версия работает автономно.</p></div>`;$('view').innerHTML=html}function backup(){let u=URL.createObjectURL(new Blob([JSON.stringify({version:1,records:data},null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='life-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}async function restoreFile(file){try{let obj=JSON.parse(await file.text());if(obj.version!==1||!Array.isArray(obj.records)||obj.records.some(r=>!['income','expense','event','task','project'].includes(r.kind)||typeof r.title!=='string'||typeof r.date!=='string'||typeof r.id!=='string'||!Number.isFinite(r.amount)))throw Error();if(!confirm('Заменить текущие записи данными из копии?'))return;data=obj.records;save()}catch{alert('Не удалось прочитать резервную копию')}}render();
</script></html>
