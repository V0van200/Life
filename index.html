<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Life · личное пространство</title><style>

olid #424758;color:#eee;border-radius:10px;margin:7px 0 15px}label{display:block;color:#afb5c4}progress{width:100%;accent-color:#b4a2ff;height:9px}.pill{font-size:12px;padding:6px 10px;border-radius:20px;background:#2d2941;color:#c3b4ff}.actions{display:flex;gap:10px;flex-wrap:wrap}#notice{padding:12px 18px;background:#232632;border-radius:12px;margin:18px 0;color:#b1b7c6;font-size:13px} @media(max-width:800px){aside{height:auto;width:100%;bottom:0;background:#171a22;z-index:3;padding:8px;border-top:1px solid #343744}aside .brand,aside p{display:none}nav{display:flex;margin:0;justify-content:space-around;gap:0}nav button{font-size:11px;padding:12px 8px}main{margin:0;padding:24px 18px 95px}.grid{display:block}.stats{gap:8px}.number{font-size:23px}.card{padding:19px}h1{font-size:28px}header button{padding:11px}.brand{font-size:20px}}

body{background:radial-gradient(ellipse at 85% 0%,#29205766,transparent 42%),radial-gradient(ellipse at 0% 70%,#00485733,transparent 40%),#080d19;color:#eff3ff}aside{background:#0b101de8;border-color:#252d46}.brand{color:#a8b5ff}main{max-width:1450px}header{padding:28px 22px;margin-bottom:20px;border-radius:24px;background:radial-gradient(ellipse at 90% 20%,#6149b944,transparent 65%),linear-gradient(125deg,#101e34,#14142a);border:1px solid #353556}h1{font-size:32px;margin:12px 0}button{background:#20263c;border:1px solid #343d5c;transition:background .2s,transform .2s}button:active{transform:scale(.97)}button:hover{background:#363458}.active{background:linear-gradient(125deg,#7835ec,#4826bd)!important;color:white;box-shadow:0 3px 18px #6e33e433}.card{background:linear-gradient(135deg,#111c2be8,#101426f5);border:1px solid #2c3650;box-shadow:0 10px 32px #0003;border-radius:22px}.hero{background:radial-gradient(ellipse at top right,#49219355,transparent 65%),linear-gradient(120deg,#132333,#111328)}.number{font-size:32px}.tag{font-size:10px;letter-spacing:2px;color:#b7a8f3}.row{border-color:#283149}.calendar{gap:7px}.calendar button{background:#141c2d;border:1px solid #202c42;border-radius:10px;min-height:58px}.calendar .today{outline:1px solid #20d9e9}.calendar button:nth-child(7n){color:#ffa3a3}.dot{color:#26e0cf;letter-spacing:2px}svg{height:190px}.quick{display:flex;gap:10px;margin:0 0 22px;overflow:auto}.quick button{white-space:nowrap;background:#171e33}.quick i{font-style:normal;color:#a6a3ff;margin-right:8px}.focus{display:flex;gap:25px;align-items:center}.ring{flex:0 0 125px;height:125px;position:relative;background:conic-gradient(#1edce4 var(--progress),#233047 0);border-radius:50%;display:grid;place-items:center;box-shadow:0 0 26px #15dbd011}.ring:before{content:'';position:absolute;inset:10px;border-radius:50%;background:#101b2b}.ring strong{z-index:1;font-size:28px;color:#31e1ec}.focusinfo{flex:1}.focusinfo b{display:block;margin:8px 0}.chips{display:flex;gap:8px;margin-bottom:16px}.chips button{font-size:12px;padding:9px 14px}.legend{display:flex;gap:18px;font-size:12px;color:#a4b0c7;margin:12px 0}.legend span:before{content:'●';color:#2ce0d0;margin-right:6px}#notice{background:#10192a;border:1px solid #26334a;color:#94a3bb;font-size:12px}nav button{color:#9caac0}nav button.active{color:#fff}.chartvalue{font-size:26px;color:#53dfdf;margin:8px 0}.calendar h2{text-transform:capitalize}input,select{background:#0b1424;border-color:#33425d}dialog{background:#111b2e;border-color:#53608c}.pill{background:#342353;color:#cab6ff}@media(max-width:800px){main{padding:14px 14px 110px}header{padding:23px 17px;margin-bottom:15px}h1{font-size:26px}.tag{font-size:8px;letter-spacing:1.5px}.number{font-size:23px}.stats p{font-size:12px}.card{padding:19px;margin-bottom:15px}.focus{gap:18px}.ring{flex-basis:105px;height:105px}.ring strong{font-size:25px}aside{background:#0b1223f5;padding-bottom:max(9px,env(safe-area-inset-bottom));backdrop-filter:blur(20px)}nav button{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 7px;border:0;border-radius:10px}nav button .navicon{font-size:21px;line-height:22px}.calendar button{min-height:51px}.quick{gap:8px}.quick button{font-size:12px;padding:13px 12px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style><link rel="stylesheet" href="assets/life-ui.css?v=0.3"><aside><div class="brand">LIFE<span style="color:#6bd1b2">.</span></div><p>Твоё личное пространство</p><nav id="nav"></nav><p style="margin-top:60px">Меньше шума.<br>Больше ясности.</p></aside><main><header><div><span class="tag">ЛИЧНЫЙ ЦЕНТР УПРАВЛЕНИЯ</span><h1 id="title"></h1></div><button class="active" onclick="openForm()">＋ Добавить</button></header><div id="notice">Записи сохраняются в этом браузере. Сервер ещё не подключён. Сохраняй резервную копию в разделе «Ещё».</div><section id="view"></section></main><dialog id="modal"><form id="form"><h2>Новая запись</h2><label>Раздел<select id="kind"><option value="expense">Расход</option><option value="income">Доход</option><option value="event">Событие</option><option value="task">Задача</option><option value="project">Проект</option></select></label><label>Название<input id="name" required maxlength="120" placeholder="Например, аренда сервера"></label><label id="moneyLabel">Сумма, ₽<input id="amount" type="number" min="0.01" step="0.01"></label><label>Дата<input id="date" type="date" required></label><div class="actions"><button class="active">Сохранить</button><button type="button" onclick="modal.close()">Отмена</button></div></form></dialog><script>
const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),today=new Date().toLocaleDateString('en-CA');let data;try{data=JSON.parse(localStorage.getItem('life-v1'))||[]}catch{data=[]}let page='home',month=new Date(),chosen=today,chartDays=14;const sections={home:'Главная',money:'Деньги',day:'Календарь',projects:'Проекты',more:'Ещё'},rub=n=>new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB',maximumFractionDigits:0}).format(n/100);function save(){localStorage.setItem('life-v1',JSON.stringify(data));render()}function openForm(k){$('kind').value=k||'expense';$('date').value=chosen;$('moneyLabel').hidden=!['expense','income'].includes($('kind').value);$('amount').required=!$('moneyLabel').hidden;$('modal').showModal()}$('kind').onchange=()=>{$('moneyLabel').hidden=!['expense','income'].includes($('kind').value);$('amount').required=!$('moneyLabel').hidden};$('form').onsubmit=e=>{e.preventDefault();data.push({id:crypto.randomUUID(),kind:$('kind').value,title:$('name').value.trim(),amount:Math.round(Number($('amount').value)*100),date:$('date').value,done:false});save();$('form').reset();$('modal').close()};function go(p){page=p;render()}function rows(items){return items.length?items.map(r=>`<div class="row"><div><b>${esc(r.title)}</b><br><small>${esc(r.date)} · ${r.kind==='task'?'Задача':r.kind==='event'?'Событие':r.kind==='project'?'Проект':r.kind==='expense'?'Расход':'Доход'}</small></div>${['expense','income'].includes(r.kind)?`<b class="${r.kind==='income'?'positive':'negative'}">${r.kind==='income'?'+':'−'}${rub(r.amount)}</b>`:`<button onclick="toggle('${r.id}')">${r.done?'✓ Готово':'○'}</button>`}</div>`).join(''):'<div class="empty">Пока пусто. Добавь первую запись — она появится здесь.</div>'}function toggle(id){data.find(r=>r.id===id).done=!data.find(r=>r.id===id).done;save()}function cal(){let y=month.getFullYear(),m=month.getMonth(),offset=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate();return `<div class="card"><div class="row"><h2>${month.toLocaleDateString('ru',{month:'long',year:'numeric'})}</h2><div><button onclick="shift(-1)">‹</button> <button onclick="shift(1)">›</button></div></div><div class="calendar">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<div class="week">${x}</div>`).join('')}${'<span></span>'.repeat(offset)}${Array.from({length:days},(_,i)=>{let d=`${y}-${String(m+1).padStart(2,'0')}-${String(i+1).padStart(2,'0')}`;return `<button class="${d===chosen?'active':d===today?'today':''}" onclick="chosen='${d}';render()">${i+1}<span class="dot">${[...new Set(data.filter(r=>r.date===d).map(r=>r.kind))].slice(0,3).map(k=>`<span style="color:${({expense:'#f98298',income:'#31e1b8',event:'#b287ff',task:'#39cce8',project:'#f3bd68'})[k]}">●</span>`).join('')}</span></button>`}).join('')}</div><h2>${esc(chosen)}</h2>${rows(data.filter(r=>r.date===chosen))}</div>`}function shift(n){month=new Date(month.getFullYear(),month.getMonth()+n,1);render()}function chart(){let points=Array.from({length:chartDays},(_,i)=>{let d=new Date();d.setDate(d.getDate()-chartDays+1+i);let key=d.toLocaleDateString('en-CA');return {date:key,value:data.filter(r=>r.date===key&&r.kind==='expense').reduce((a,r)=>a+r.amount,0)}}),max=Math.max(...points.map(p=>p.value),1),coords=points.map((p,i)=>[12+i*536/(chartDays-1),145-p.value/max*115]),path=coords.map((p,i)=>`${i?'L':'M'}${p[0]} ${p[1]}`).join(' '),total=points.reduce((a,p)=>a+p.value,0);return `<div class="chips">${[7,14,30].map(n=>`<button class="${chartDays===n?'active':''}" onclick="chartDays=${n};render()">${n} дней</button>`).join('')}</div><div class="chartvalue">${rub(total)}</div><small>Расходы за выбранный период</small><svg viewBox="0 0 560 175" role="img" aria-label="Расходы по дням"><defs><linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#16d9da" stop-opacity=".35"/><stop offset="1" stop-color="#16d9da" stop-opacity="0"/></linearGradient></defs>${[30,85,145].map(y=>`<path d="M12 ${y}H548" stroke="#263448" stroke-dasharray="3 6"/>`).join('')}<path d="${path}L548 150L12 150Z" fill="url(#area)"/><path d="${path}" stroke="#29e2df" stroke-width="3" stroke-linejoin="round" fill="none"/>${coords.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#9ff7ef"><title>${points[i].date}: ${rub(points[i].value)}</title></circle>`).join('')}</svg><small>${points[0].date}<span style="float:right">Сегодня</span></small>${total===0?'<p>Добавь расходы, чтобы увидеть динамику.</p>':''}<details><summary>Данные графика</summary>${points.map(p=>`<div class="row"><small>${p.date}</small><span>${rub(p.value)}</span></div>`).join('')}</details>`}function focusCard(){let tasks=data.filter(r=>r.kind==='task'&&r.date===today),done=tasks.filter(r=>r.done).length,percent=tasks.length?Math.round(done/tasks.length*100):0,next=tasks.find(r=>!r.done);return `<div class="card hero"><h2>Сегодня <span class="pill">${done} из ${tasks.length} задач</span></h2><div class="focus"><div class="ring" style="--progress:${percent}%"><strong>${percent}%</strong></div><div class="focusinfo"><small>Следующий шаг</small><b>${next?esc(next.title):'Выбери главное на сегодня'}</b><small>${tasks.length?'Прогресс по задачам на сегодня':'Добавь задачу, чтобы начать'}</small><div style="margin-top:12px"><button onclick="openForm('task')">＋ Задача</button></div></div></div></div>`}function render(){ $('nav').innerHTML=Object.entries(sections).map(([k,v])=>`<button class="${page===k?'active':''}" onclick="go('${k}')"><span class="navicon">${({home:'⌂',money:'◉',day:'▦',projects:'◇',more:'☰'})[k]}</span>${v}</button>`).join('');$('title').textContent=page==='home'?'Твой день, Вован':sections[page];let income=data.filter(r=>r.kind==='income').reduce((a,r)=>a+r.amount,0),expense=data.filter(r=>r.kind==='expense').reduce((a,r)=>a+r.amount,0),fin=`<div class="card hero"><span class="tag">ФИНАНСОВАЯ КАРТИНА</span><div class="stats"><div><p>Баланс записей</p><div class="number">${rub(income-expense)}</div></div><div><p>Доходы</p><div class="number positive">${rub(income)}</div></div><div><p>Расходы</p><div class="number">${rub(expense)}</div></div></div><p>За всё время · начальный остаток пока не задан</p></div>`,graph=`<div class="card"><h2>Ритм расходов</h2>${chart()}</div>`;let html='';if(page==='home')html=`<div class="quick"><button onclick="openForm('task')"><i>✓</i>Задача</button><button onclick="openForm('expense')"><i>−</i>Расход</button><button onclick="openForm('income')"><i>＋</i>Доход</button><button onclick="openForm('event')"><i>▦</i>Событие</button></div>${focusCard()}${fin}<div class="grid"><div>${graph}<div class="card"><h2>В фокусе сегодня <span class="pill">${data.filter(r=>r.kind==='task'&&!r.done).length} задач</span></h2>${rows(data.filter(r=>r.kind==='task'&&!r.done).slice(0,4))}<button onclick="openForm('task')">＋ Задача</button></div></div><div>${cal()}</div></div>`;if(page==='money')html=fin+graph+`<div class="card"><h2>История операций</h2>${rows(data.filter(r=>['income','expense'].includes(r.kind)).sort((a,b)=>b.date.localeCompare(a.date)))}</div>`;if(page==='day')html=cal();if(page==='projects')html=`<div class="card hero"><h2>От идеи до результата</h2><p>Держи актуальные проекты перед глазами. Начни с одного следующего шага.</p><button onclick="openForm('project')">＋ Новый проект</button></div><div class="card">${rows(data.filter(r=>r.kind==='project'))}</div><div class="card"><h2>Все задачи</h2>${rows(data.filter(r=>r.kind==='task'))}</div>`;if(page==='more')html=`<div class="card"><h2>Твои данные</h2><p>${data.length} записей · локальное хранение на этом устройстве</p><div class="actions"><button onclick="backup()">Скачать резервную копию</button><button onclick="document.getElementById('restore').click()">Восстановить копию</button><input type="file" id="restore" accept="application/json" hidden onchange="restoreFile(this.files[0])"></div></div><div class="card"><h2>Структура Life</h2><p>Финансы → операции<br>Календарь → события и задачи<br>Проекты → список проектов<br>Данные → резервные копии</p><p>Обучение, подписки, связи проектов и серверная синхронизация появятся следующими. Эта версия работает автономно.</p></div>`;$('view').innerHTML=html}function backup(){let u=URL.createObjectURL(new Blob([JSON.stringify({version:1,records:data},null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='life-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}async function restoreFile(file){try{let obj=JSON.parse(await file.text());if(obj.version!==1||!Array.isArray(obj.records)||obj.records.some(r=>!['income','expense','event','task','project'].includes(r.kind)||typeof r.title!=='string'||typeof r.date!=='string'||typeof r.id!=='string'||!Number.isFinite(r.amount)))throw Error();if(!confirm('Заменить текущие записи данными из копии?'))return;data=obj.records;save()}catch{alert('Не удалось прочитать резервную копию')}}render();
</script><script src="assets/life-core.js?v=0.3"></script><script src="assets/life-app.js?v=0.3"></script></html>
